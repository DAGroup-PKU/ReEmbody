[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reembody"
version = "0.1.0"
description = "ReEmbody: Cross-Embodiment Data Reuse for Real-World Robot Learning (Real1-Sim1-Sim2-Real2 Data Pipeline)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Yichen Liu" },
    { name = "Daquan Zhou" },
    { name = "DAGroup-PKU" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pyarrow>=15.0",
    "av>=12.0",
]

[project.optional-dependencies]
physics = [
    "mujoco==3.3.7",
    "opencv-python>=4.8",
    "jsonschema>=4.20",
]
render = [
    "bpy==4.5.14",
]
lerobot = [
    "lerobot>=0.3.3",
]
llm = [
    "openai>=1.50",
]

[project.urls]
Homepage = "https://dagroup-pku.github.io/ReEmbody.github.io/"
Repository = "https://github.com/DAGroup-PKU/ReEmbody"

[tool.setuptools.packages.find]
include = ["reembody*"]
